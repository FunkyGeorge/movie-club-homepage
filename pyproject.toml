[project]
name = "movie-club"
version = "0.1.0"
description = "Movie club server"
requires-python = ">=3.12"
dependencies = [
  "django~=5.2",
  "psycopg[binary]>=3.2",
  "httpx>=0.28",
  "django-environ>=0.12",
]

[dependency-groups]
dev = [
  "matplotlib>=3.11.2",
  "pandas>=3.1.0",
  "pytest>=8",
  "pytest-django>=4.9",
  "respx>=0.22",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "config.settings"
python_files = ["test_*.py", "*_tests.py", "tests.py"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py312"
exclude = ["*/migrations/*"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
